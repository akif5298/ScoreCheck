name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  server:
    name: Server (lint, typecheck, test, build)
    runs-on: ubuntu-latest

    # `npm test` runs two Jest projects: `unit`, which needs nothing, and `integration`,
    # which runs against a real Postgres. The harness provisions its own schema from the
    # committed migrations and clones a database per worker, so a bare server on the port
    # test/integration/db-name.ts expects is the whole requirement — no seed, no dump,
    # no production access.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: int
        ports:
          - 55434:5432
        # Without a healthcheck the job races the container and globalSetup fails on a
        # connection refused that looks exactly like a misconfiguration.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma resolves the datasource env() vars when it loads the schema (validate errors
      # P1012 without them). These are dummy placeholders — generate/validate never connect —
      # scoped to just these steps so the test/build steps are unaffected.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/scorecheck
          DIRECT_DATABASE_URL: postgresql://user:password@localhost:5432/scorecheck

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/scorecheck
          DIRECT_DATABASE_URL: postgresql://user:password@localhost:5432/scorecheck

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build:api

  client:
    name: Client (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build
